<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#gridPattern)" />
  <circle cx="400" cy="225" r="220" fill="url(#glowOrb)" />

  <!-- Cyber Circuit Lines -->
  <g stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 50 100 L 220 100 L 280 160 L 520 160 L 580 100 L 750 100" />
    <path d="M 80 350 L 250 350 L 310 290 L 490 290 L 550 350 L 720 350" />
    <circle cx="220" cy="100" r="4" fill="#f59e0b" />
    <circle cx="580" cy="100" r="4" fill="#f59e0b" />
    <circle cx="250" cy="350" r="4" fill="#00f2fe" />
    <circle cx="550" cy="350" r="4" fill="#00f2fe" />
  </g>

  <!-- Central Visual Container -->
  <g transform="translate(400, 200)">
    <!-- Outer Decorative Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="70" fill="#0d1527" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Central Icon/Symbol -->
    <g transform="translate(-32, -32) scale(1.3)" fill="#00f2fe">
      <path d="M24 2C11.8 2 2 11.8 2 24s9.8 22 22 22 22-9.8 22-22S36.2 2 24 2zm0 6c8.8 0 16 7.2 16 16s-7.2 16-16 16S8 32.8 8 24 15.2 8 24 8zm-2 8v10l8-6-8-4z"/>
    </g>
  </g>

  <!-- Title & Subtitle Badge -->
  <g transform="translate(400, 360)" text-anchor="middle">
    <!-- Cyber Badge Pill -->
    <rect x="-180" y="-22" width="360" height="42" rx="21" fill="rgba(11, 19, 39, 0.85)" stroke="url(#primaryGrad)" stroke-width="1.2"/>
    <text x="0" y="5" font-family="'Cairo', 'Poppins', sans-serif" font-weight="700" font-size="17" fill="#ffffff" letter-spacing="0.5">Digital Battery Voltmeter</text>
  </g>
  
  <!-- Subtitle Tag -->
  <g transform="translate(400, 410)" text-anchor="middle">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f2fe" letter-spacing="1.5">VOLTAGE DIVIDER • PRECISION ADC</text>
  </g>

  <!-- Hardware Tech Corners -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 760 20 L 780 20 L 780 40" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 20 410 L 20 430 L 40 430" stroke="#00f2fe" stroke-width="2" fill="none"/>
  <path d="M 760 430 L 780 430 L 780 410" stroke="#00f2fe" stroke-width="2" fill="none"/>
</svg>